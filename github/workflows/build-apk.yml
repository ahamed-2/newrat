Name: Build MyEyeApp APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ২. জাভা সেটআপ (Native Android এর জন্য এটিই মেইন)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ৩. গ্রেডল পারমিশন ঠিক করা
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ৪. ভার্সন আপডেট এবং কোড মডিফিকেশন (আপনার রেফারেন্সের মত)
      - name: Update Version & Configure Manifest
        run: |
          # ভার্সন কোড এবং নেম আপডেট করা (app/build.gradle ফাইলে)
          sed -i 's/versionCode [0-9]*/versionCode 2/' app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.1.0"/' app/build.gradle
          
          # Manifest এ কিছু আপডেট প্রয়োজন হলে (যেমন প্যাকেজ নেম কনফার্ম করা)
          sed -i 's/package="[^"]*"/package="com.ahamedrahim.myeye"/' app/src/main/AndroidManifest.xml

      # ৫. Obfuscation (কোড লুকানো) - জাভার জন্য ProGuard/R8 এনাবল করা
      # আমরা ডিবাগ বিল্ডেও 'minifyEnabled true' করে দিচ্ছি যাতে কোড Obfuscate হয়
      - name: Enable Obfuscation (R8/ProGuard)
        run: |
          sed -i 's/minifyEnabled false/minifyEnabled true/' app/build.gradle
          sed -i 's/shrinkResources false/shrinkResources true/' app/build.gradle

      # ৬. অ্যাপ বিল্ড করা
      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      # ৭. APK আপলোড করা
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyEyeApp-v1.1.0-build
          path: app/build/outputs/apk/debug/app-debug.apk
