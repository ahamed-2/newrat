name: Build My Eye APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # ম্যানুয়ালি বিল্ড রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Manifest এর প্যাকেজ নেম অনুযায়ী build.gradle আপডেট করা
    - name: Configure Package Name
      run: |
        # প্যাকেজ নেম com.ahamedrahim.myeye নিশ্চিত করা
        sed -i 's/applicationId ".*"/applicationId "com.ahamedrahim.myeye"/' app/build.gradle
        
        # Manifest এর সাথে মিলিয়ে ভার্সন সেট করা (Optional)
        sed -i 's/versionCode [0-9]*/versionCode 1/' app/build.gradle
        sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' app/build.gradle

    - name: Build with Gradle
      # সরাসরি gradle এর বদলে wrapper ব্যবহার করা ভালো
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyEye-Debug-APK
        # আপনার প্রোজেক্ট স্ট্রাকচার অনুযায়ী সঠিক পাথ
        path: app/build/outputs/apk/debug/*.apk
