name: Build MyEyeApp APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # APK সাইজ কমানো এবং কোড প্রোটেকশন (Optional)
    - name: Enable ProGuard/R8
      run: |
        sed -i 's/minifyEnabled false/minifyEnabled true/' app/build.gradle || true
        sed -i 's/shrinkResources false/shrinkResources true/' app/build.gradle || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyEyeApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
